services:
  - type: web
    name: huku-hub
    runtime: docker
    plan: free
    rootDir: poultry-system/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
