spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/poultry}
    username: ${DB_USER:poultry}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
app.business-timezone: Africa/Harare
app.weather:
  latitude: ${WEATHER_LATITUDE:-17.8252}
  longitude: ${WEATHER_LONGITUDE:31.0335}
  location: ${WEATHER_LOCATION:Harare, Zimbabwe}
management:
  endpoints.web.exposure.include: health
server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet.session.timeout: 30m
  servlet.session.cookie:
    http-only: true
    same-site: lax
    secure: ${SESSION_COOKIE_SECURE:false}
